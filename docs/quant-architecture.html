<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>量化项目架构 · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · shuyizhou / quant</p>
    <h1>量化项目架构</h1>

    <div class="scroll">
    <svg viewBox="0 176 1000 364" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="quant-architecture-title quant-architecture-desc">
      <title id="quant-architecture-title">量化项目架构</title>
      <desc id="quant-architecture-desc">行情从盈透 IBKR 下载到本地 CSV，经过指标与形态计算、策略生成仓位，进入回测引擎输出报告图表；风控检查另外读取 IBKR 账户数据。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect x="0" y="176" width="1000" height="364" fill="#f5f5f5"/>

      <!-- Zone: 分析引擎 (drawn before arrows and nodes) -->
      <rect x="416" y="200" width="536" height="112" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="652" y="204" width="64" height="16" rx="2" fill="#f5f5f5"/>
      <text x="684" y="216" fill="#5a6580" font-size="12" font-weight="500"
            font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">分析引擎</text>

      <!-- Arrows first (behind boxes) -->
      <!-- IBKR → 行情数据 (external API) -->
      <line x1="200" y1="264" x2="248" y2="264" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- 行情数据 → 指标与形态 -->
      <line x1="384" y1="264" x2="432" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 指标与形态 → 策略信号 -->
      <line x1="568" y1="264" x2="616" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 策略信号 → 回测引擎 (primary path) -->
      <line x1="752" y1="264" x2="800" y2="264" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- IBKR → 风控检查 (account data, external API) -->
      <line x1="132" y1="296" x2="132" y2="376" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- 回测引擎 → 报告与图表 -->
      <line x1="868" y1="296" x2="868" y2="376" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels (masked, 6px gap from stroke) -->
      <rect x="210" y="242" width="28" height="16" rx="2" fill="#f5f5f5"/>
      <text x="224" y="254" fill="#2e5aa8" font-size="12" font-weight="500"
            font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">下载</text>

      <rect x="394" y="246" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="408" y="255" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OHLCV</text>

      <rect x="762" y="242" width="28" height="16" rx="2" fill="#f5f5f5"/>
      <text x="776" y="254" fill="#bf4520" font-size="12" font-weight="500"
            font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">仓位</text>

      <rect x="140" y="328" width="28" height="16" rx="2" fill="#f5f5f5"/>
      <text x="154" y="340" fill="#2e5aa8" font-size="12" font-weight="500"
            font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">账户</text>

      <rect x="876" y="328" width="28" height="16" rx="2" fill="#f5f5f5"/>
      <text x="890" y="340" fill="#4f5d75" font-size="12" font-weight="500"
            font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">绩效</text>

      <!-- Node: 盈透 IBKR (external) -->
      <rect x="64" y="232" width="136" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="232" width="136" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
      <rect x="72" y="240" width="28" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
      <text x="86" y="249" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="132" y="270" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">盈透 IBKR</text>
      <text x="132" y="286" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">MCP connector</text>

      <!-- Node: 行情数据 (store) -->
      <rect x="248" y="232" width="136" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="248" y="232" width="136" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="256" y="240" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="270" y="249" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CSV</text>
      <text x="316" y="270" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">行情数据</text>
      <text x="316" y="286" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">data/*.csv</text>

      <!-- Node: 指标与形态 (backend) -->
      <rect x="432" y="232" width="136" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="432" y="232" width="136" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="440" y="240" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="456" y="249" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CALC</text>
      <text x="500" y="270" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">指标与形态</text>
      <text x="500" y="286" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">indicators.py</text>

      <!-- Node: 策略信号 (backend) -->
      <rect x="616" y="232" width="136" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="616" y="232" width="136" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="624" y="240" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="638" y="249" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SIG</text>
      <text x="684" y="270" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">策略信号</text>
      <text x="684" y="286" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">price_action.py</text>

      <!-- Node: 回测引擎 (focal) -->
      <rect x="800" y="232" width="136" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="800" y="232" width="136" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <rect x="808" y="240" width="32" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
      <text x="824" y="249" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
      <text x="868" y="270" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">回测引擎</text>
      <text x="868" y="286" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">backtest · intraday</text>

      <!-- Node: 风控检查 (backend) -->
      <rect x="64" y="376" width="136" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="376" width="136" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="72" y="384" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="88" y="393" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RISK</text>
      <text x="132" y="414" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">风控检查</text>
      <text x="132" y="430" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">risk_guard.py</text>

      <!-- Node: 报告与图表 (store) -->
      <rect x="800" y="376" width="136" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="800" y="376" width="136" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="808" y="384" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="822" y="393" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
      <text x="868" y="414" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">报告与图表</text>
      <text x="868" y="430" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">output/*.png</text>

      <!-- Legend strip -->
      <line x1="40" y1="472" x2="960" y2="472" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="488" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="504" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <text x="60" y="513" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">核心模块</text>

      <rect x="160" y="504" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="180" y="513" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">计算模块</text>

      <rect x="280" y="504" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="300" y="513" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">文件存储</text>

      <rect x="400" y="504" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
      <text x="420" y="513" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">外部服务</text>

      <line x1="532" y1="509" x2="560" y2="509" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="568" y="513" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">接口调用</text>

      <line x1="664" y1="509" x2="692" y2="509" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="700" y="513" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">主流程</text>

      <line x1="784" y1="509" x2="812" y2="509" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="820" y="513" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">数据传递</text>
    </svg>
    </div>
  </div>
</body>
</html>
